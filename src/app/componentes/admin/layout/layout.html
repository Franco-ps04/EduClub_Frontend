<div class="et-shell">

  <!-- Sidebar -->
  <aside class="et-sidebar d-flex flex-column">
    <div class="px-3 pt-4 pb-3">
      <div class="d-flex align-items-center gap-2">
        <span class="et-logo-icon">
          <i class="bi bi-mortarboard-fill text-white" style="font-size:15px"></i>
        </span>
        <span class="fw-bold text-white fs-5">Edu<span class="et-text-green">Taller</span></span>
      </div>
    </div>

    <div class="px-3 pb-2">
      <p class="text-white-50 px-2 mb-2"
        style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600">
        @if (isAdministrador()) { Administración } @else { Docente }
      </p>
    </div>

    <nav class="flex-grow-1 px-2">
      <a routerLink="/admin/talleres" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-journal-bookmark-fill"></i> Talleres
      </a>

      <a routerLink="/admin/mis-talleres" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-file-earmark-text-fill"></i> Mis talleres
      </a>

      <a routerLink="/admin/inscripcion" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-people-fill"></i> Inscripción
      </a>

      <a routerLink="/admin/mensajes" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-envelope-fill"></i> Mensajes
        @if (sinLeer > 0) {
        <span class="badge bg-danger rounded-pill ms-auto" style="font-size:10px">
          {{ sinLeer }}
        </span>
        }
      </a>

      <a routerLink="/admin/enrollar" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-person-plus-fill"></i> Enrollar
      </a>

      @if (isAdministrador()) {
      <a routerLink="/admin/usuarios" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-person-badge-fill"></i> Usuarios
      </a>

      <a routerLink="/admin/reportes" routerLinkActive="active" class="et-nav-link">
        <i class="bi bi-bar-chart-fill"></i> Reportes
      </a>
      }
    </nav>

    <!-- Usuario al fondo -->
    <div class="et-sidebar-footer px-2 pt-3 pb-2">
      <div class="d-flex align-items-center gap-2 mb-2 px-1">
        <span class="et-avatar">{{ getInitials() }}</span>
        <div class="flex-grow-1 overflow-hidden" style="min-width:0">
          <div class="text-white small fw-medium text-truncate">{{ getNombre() }}</div>
          <div class="text-truncate" style="color:#7c8aa0;font-size:11px">{{ getEmail() }}</div>
        </div>
      </div>
      <button class="et-btn-salir" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </div>
  </aside>

  <!-- Contenido -->
  <div class="et-main">
    <header class="et-topbar d-flex justify-content-end align-items-center px-4">
      <a routerLink="/" class="btn btn-sm btn-outline-success">
        <i class="bi bi-globe me-1"></i>Ver sitio web
      </a>
    </header>

    <main class="et-content p-4">
      <router-outlet />
    </main>
  </div>
</div>
